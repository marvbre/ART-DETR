__include__: [
  '../dataset/visdrone_detection_person.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]

output_dir: ./output/rtdetrv2_r101vd_6x_aerial_best_eo

eval_spatial_size: [1280, 1280] 

PResNet:
  depth: 101
  freeze_at: -1
  freeze_norm: False
  pretrained: False

HybridEncoder:
  # intra
  hidden_dim: 384
  dim_feedforward: 2048


RTDETRTransformerv2:
  feat_channels: [384, 384, 384]


optimizer:
  type: AdamW
  params: 
    - 
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.


epoches: 30 
