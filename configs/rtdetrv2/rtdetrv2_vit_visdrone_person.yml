__include__: [
  '../dataset/visdrone_detection_person.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_vit.yml',
]

eval_spatial_size: [1280, 1280]


output_dir: ./output/rtdetrv2_vit

RTDETRTransformerv2:
  num_layers: 3

epoches: 120 

optimizer:
  type: AdamW
  params:
    - 
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.


train_dataloader: 
  dataset: 
    transforms:
      policy:
        epoch: 117
  collate_fn:
    scales: ~